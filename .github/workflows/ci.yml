name: CI

on:
  push:
  pull_request:

# A newer commit on the same branch / PR cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build and test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify
        run: ./mvnw -B verify -Dnpm.install=ci

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            core/target/site/jacoco/
          if-no-files-found: ignore

  e2e:
    name: Build, test and e2e
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify with end-to-end tests
        run: ./mvnw -B verify -Pe2e -Dnpm.install=ci "-Dplaywright.install.args=--with-deps chromium"

      - name: Upload test reports and server log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            e2e/target/e2e-server.log
          if-no-files-found: ignore
